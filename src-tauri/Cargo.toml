[package]
name = "sunspire"
version = "1.0.0"
description = "Sunspire Minecraft launcher"
authors = ["Sunspire Systems"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "sunspire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "multipart"] }
futures-util = "0.3"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
url = "2"
zip = "2"
walkdir = "2"
regex = "1"
sysinfo = "0.37"
discord-rich-presence = "1"
lighty-launcher = { version = "26.11.0", features = ["all-loaders", "modrinth", "events"] }
secrecy = "0.10"
